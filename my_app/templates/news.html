<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #fff;
    background-image: url("https://i.pinimg.com/736x/1d/6a/08/1d6a08d9b18f16cc49cdaddfa878e8a0.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

@media (max-width: 600px) {
    body { background-attachment: scroll; } /* iOS Safari fixed bilan ishlamaydi */
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: rgba(20,20,20,0.8);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.nav-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
}

.nav-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: white;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
}

/* ICON BUTTONS (qidiruv / sozlamalar) */
.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
}

.icon-btn:active { transform: scale(0.92); }

/* SEARCH BAR */
.search-bar {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, padding 0.25s ease;
    padding: 0 14px;
    background: rgba(15,15,15,0.6);
}

.search-bar.open {
    max-height: 64px;
    padding: 10px 14px;
}

.search-bar input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 14px;
    outline: none;
}

.search-bar input::placeholder { color: #999; }

/* SETTINGS PANEL */
.settings-wrapper { position: relative; }

.settings-panel {
    display: none;
    position: absolute;
    right: 0;
    top: 46px;
    background: #1c1c1c;
    padding: 10px;
    border-radius: 12px;
    width: 190px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    z-index: 1001;
}

.settings-panel h4 { margin: 4px 0 10px; font-size: 14px; }

.bg-list {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.settings-panel img,
.bg-swatch {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.15);
    transition: 0.2s ease;
}

.settings-panel img:hover,
.bg-swatch:hover {
    transform: scale(1.1);
    border-color: #ff3b5c;
}

.bg-swatch.bg-black { background: #000; }

.reset-btn {
    width: 100%;
    padding: 6px;
    border: none;
    background: #ff3b5c;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* CARD */
.card {
    background: rgba(26, 26, 26, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    margin: 10px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    position: relative;
}

.card-link { position: absolute; inset: 0; z-index: 1; }
.actions { position: relative; z-index: 2; }

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
}

/* IMAGE + SKELETON */
.img-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
    overflow: hidden;
}

.img-wrap .skeleton {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 37%, #1a1a1a 63%);
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
}

@keyframes skeleton-loading {
    0% { background-position: 100% 50%; }
    100% { background-position: 0 50%; }
}

.img-wrap img {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.img-wrap img.loaded { opacity: 1; }

/* CONTENT */
.content { padding: 10px; }
.title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
.desc { font-size: 14px; color: #bbb; }

/* ACTIONS */
.actions {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    border-top: 1px solid #333;
}

.btn {
    cursor: pointer;
    font-size: 14px;
    color: #fff;
    background: none;
    border: none;
}

a { text-decoration: none; color: inherit; }

.card-container {
    display: grid;
    grid-template-columns: repeat(1, 1fr);
    gap: 10px;
    padding: 10px;
}

.like-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.06);
    border: none;
    padding: 6px 10px;
    border-radius: 10px;
    cursor: pointer;
}

.like-icon { font-size: 20px; color: #aaa; transition: 0.2s; }

.like-btn.liked .like-icon {
    color: #ff3b5c;
    transform: scale(1.2);
}

/* LOADING / INFINITE SCROLL */
.loading-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    color: #aaa;
    font-size: 14px;
}

.spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #ff3b5c;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

#scrollSentinel { height: 1px; }

@media (max-width: 600px) {
    .header { padding: 12px 14px; }
    .card-container { grid-template-columns: repeat(1, minmax(0, 1fr)); gap: 12px; padding: 12px 10px; box-sizing: border-box; }
    .card { border-radius: 14px; margin: 0; border: 1px solid rgba(255, 255, 255, 0.05); }
    .card:active { transform: scale(0.98); }
    .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .desc {
        font-size: 13px; color: #bbb; line-height: 1.4;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .actions { padding: 8px; }
    .btn { font-size: 13px; }
}

@media (min-width: 768px) {
    .card-container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; padding: 15px; }
    .card { border-radius: 14px; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
    .title { font-size: 19px; }
    .desc { font-size: 14px; }
}

@media (min-width: 1024px) {
    .card-container { grid-template-columns: repeat(3, 1fr); }
}
</style>

<meta name="google-site-verification" content="GOOGLE_CODE">

<body>

<div class="header">
    <a href="{% url 'home' %}" class="nav-btn" aria-label="Orqaga">⬅</a>
    <div class="nav-title">BESTMEDIA NEWS</div>

    <div class="header-actions">
        <button class="icon-btn" onclick="toggleSearch()" aria-label="Qidiruv">
            <i class='bx bx-search'></i>
        </button>

        <div class="settings-wrapper">
            <button class="icon-btn" onclick="toggleSettings()" aria-label="Sozlamalar">
                <i class='bx bx-cog'></i>
            </button>

            <div id="settingsPanel" class="settings-panel">
                <h4>🎨 Fon tanlash</h4>
                <div class="bg-list">
                    <img src="https://i.pinimg.com/736x/5b/53/88/5b53888b7f316b71d14f25932d09a7a8.jpg" onclick="setBg(this.src)">
                    <img src="https://i.pinimg.com/736x/2f/3e/24/2f3e24af82da99275c2d8677985c5a26.jpg" onclick="setBg(this.src)">
                    <div class="bg-swatch bg-black" onclick="setBg('#000000')" title="Qora fon"></div>
                </div>
                <button onclick="resetBg()" class="reset-btn">Reset</button>
            </div>
        </div>
    </div>
</div>

<div id="searchBar" class="search-bar">
    <input type="text" id="searchInput" placeholder="Yangilik qidirish..." oninput="filterNews()">
</div>

<div id="newsContainer" class="card-container">
    {% include 'news_cards.html' %}
</div>

<div id="loadingIndicator" class="loading-indicator" style="display:none;">
    <div class="spinner"></div> Yuklanmoqda...
</div>

{% if has_more %}
    <div id="scrollSentinel"></div>
{% endif %}

<script>

let settingsOpen = false;
let currentPage = 1;
let isLoading = false;
let hasMore = {{ has_more|yesno:"true,false" }};

/* ============ LIKE ============ */
function likeNews(id) {
    const btn = document.querySelector(`#like-${id}`).closest(".like-btn");

    fetch(`/news/${id}/like/`, {
        method: "GET",
        headers: { "X-Requested-With": "XMLHttpRequest" }
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById(`like-${id}`).innerText = data.total_likes;

        if (data.liked) {
            btn.classList.add("liked");
            btn.querySelector("i").className = "bx bxs-heart like-icon";
        } else {
            btn.classList.remove("liked");
            btn.querySelector("i").className = "bx bx-heart like-icon";
        }
    });
}

/* ============ BACKGROUND ============ */
function setBg(value) {
    if (value.startsWith('#')) {
        document.body.style.backgroundImage = "none";
        document.body.style.backgroundColor = value;
    } else {
        document.body.style.backgroundColor = "";
        document.body.style.backgroundImage = `url(${value})`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";
    }
    localStorage.setItem("bg", value);
}

function resetBg() {
    document.body.style.backgroundImage = "none";
    document.body.style.backgroundColor = "";
    localStorage.removeItem("bg");
}

/* ============ SETTINGS PANEL ============ */
function toggleSettings() {
    const panel = document.getElementById("settingsPanel");
    settingsOpen = !settingsOpen;
    panel.style.display = settingsOpen ? "block" : "none";
}

function closeSettings() {
    document.getElementById("settingsPanel").style.display = "none";
    settingsOpen = false;
}

window.addEventListener("scroll", () => { if (settingsOpen) closeSettings(); });

document.addEventListener("touchstart", (e) => {
    const button = document.querySelector(".settings-wrapper");
    if (settingsOpen && !button.contains(e.target)) closeSettings();
});

/* ============ SEARCH (yuklangan cardlar ichida) ============ */
function toggleSearch() {
    const bar = document.getElementById('searchBar');
    bar.classList.toggle('open');
    if (bar.classList.contains('open')) {
        document.getElementById('searchInput').focus();
    } else {
        document.getElementById('searchInput').value = '';
        filterNews();
    }
}

function filterNews() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    document.querySelectorAll('#newsContainer .card').forEach(card => {
        const title = card.querySelector('.title').textContent.toLowerCase();
        card.style.display = title.includes(q) ? '' : 'none';
    });
}

/* ============ INFINITE SCROLL (sekin/silliq) ============ */
function initInfiniteScroll() {
    const sentinel = document.getElementById('scrollSentinel');
    if (!sentinel) return;

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !isLoading && hasMore) {
                loadMoreNews();
            }
        });
    }, { rootMargin: '250px' });

    observer.observe(sentinel);
}

function loadMoreNews() {
    isLoading = true;
    document.getElementById('loadingIndicator').style.display = 'flex';
    currentPage += 1;

    /* atayin kichik kechikish — tez skroll qilinganda darhol "sakramasin" */
    setTimeout(() => {
        fetch(`/news/load-more/?page=${currentPage}`, {
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('newsContainer').insertAdjacentHTML('beforeend', data.html);
            hasMore = data.has_more;
            document.getElementById('loadingIndicator').style.display = 'none';
            isLoading = false;

            if (!hasMore) {
                const sentinel = document.getElementById('scrollSentinel');
                if (sentinel) sentinel.remove();
            }
        })
        .catch(() => {
            isLoading = false;
            document.getElementById('loadingIndicator').style.display = 'none';
        });
    }, 600);
}

window.onload = function () {
    const bg = localStorage.getItem("bg");
    if (bg) setBg(bg);
    initInfiniteScroll();
};

</script>

</body>
</html>
