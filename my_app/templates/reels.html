<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: white;
            min-height: 100vh;
            padding: 15px;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 700px;
            margin: auto;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #00d4ff;
            color: #000;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #00aacc;
            transform: scale(1.05);
        }

        h1 {
            font-size: 22px;
            text-align: center;
            flex: 1;
        }

        /* BOX */
        .reels-box {
            max-width: 700px;
            margin: auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            animation: fadeIn 0.6s ease-in-out;
        }

        .reels-box h2 {
            margin-bottom: 15px;
            color: #00d4ff;
            text-align: center;
        }

        .reel-item {
            margin: 12px 0;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            transition: 0.3s;
            animation: slideUp 0.5s ease;
        }

        .reel-item:hover {
            transform: translateY(-3px);
            background: rgba(0,212,255,0.15);
        }

        .reel-item a {
            color: white;
            text-decoration: none;
            display: block;
            font-size: 16px;
        }

        .reel-item a:hover {
            color: #00d4ff;
        }

        .reel-item {
            margin: 12px 0;
            padding: 14px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            transition: 0.3s;
            animation: floatMove 3s ease-in-out infinite;
        }

        /* Hover effekti */
        .reel-item:hover {
            transform: scale(1.05);
            background: rgba(0,212,255,0.15);
            animation: none; /* hoverda animatsiya to‘xtaydi */
        }

        /* LINK */
        .reel-item a {
            color: white;
            text-decoration: none;
            display: block;
            font-size: 16px;
        }

        /* FLOAT ANIMATION */
        @keyframes floatMove {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-6px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from {opacity: 0; transform: scale(0.98);}
            to {opacity: 1; transform: scale(1);}
        }

        @keyframes slideUp {
            from {opacity: 0; transform: translateY(10px);}
            to {opacity: 1; transform: translateY(0);}
        }

        /* MOBILE */
        @media (max-width: 600px) {
            h1 {
                font-size: 18px;
            }

            .back-btn {
                padding: 8px 12px;
                font-size: 14px;
            }

            .reel-item {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="top-bar">
    <a href="/" class="back-btn">⬅ Orqaga</a>
    <h1>Reels</h1>
</div>

<div class="reels-box">
    <h2>Mavjud reelslar</h2>

  <div class="reel-item">
      <a href="https://bestmedia-official.uz/reels/1" target="_blank">
          🎬 Reels 1 - Ko‘rish
      </a>
  </div>

  <div class="reel-item">
      <a href="https://bestmedia-official.uz/reels/2" target="_blank">
          🎬 Reels 2 - Ko‘rish
      </a>
  </div>

</div>

</body>
</html>
