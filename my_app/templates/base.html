{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}BESTMEDIA - O'zbekistondagi Eng Yaxshi Media Sayti{% endblock %}</title>

    <meta name="description"
          content="Eng sara va yangi anime seriallarni yuqori sifatda o'zbek tilida bepul tomosha qiling.">
    <meta name="keywords"
          content="anime, anime uzbek tilida, anime bepul, anime streaming, o'zbekcha anime, bestmedia, anime sayt">
    <meta name="author" content="BESTMEDIA">
    <meta name="robots" content="index, follow">

    <!-- ============================================================
         FAVICON — FANDUB LOGOSI (browser tab, mobil bosh ekran)
    ============================================================ -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="alternate icon" href="{% static 'images/favicon.svg' %}">
    <link rel="apple-touch-icon" href="{% static 'images/favicon.png' %}">
    <link rel="manifest" href="/manifest.json">

    <!-- ============================================================
         OPEN GRAPH / GOOGLE va IJTIMOIY TARMOQLAR UCHUN RASM
         MUHIM: content="..." ichidagi domenni o'zingizning haqiqiy
         domeningizga almashtiring. Rasm albatta TO'LIQ (absolute)
         URL bo'lishi kerak — static tegi yolg'iz o'zi YETARLI EMAS,
         chunki u faqat "/static/..." kabi nisbiy yo'l chiqaradi.
         MUHIM 2: Telegram/Facebook/WhatsApp SVG'ni ko'rsatmaydi,
         shuning uchun bu yerda PNG (favicon.png) ishlatilmoqda.
    ============================================================ -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bestmedia-official.uz/">
    <meta property="og:title" content="BESTMEDIA - O'zbekistondagi Eng Yaxshi Media Sayti">
    <meta property="og:description"
          content="Eng sara va yangi anime seriallarni yuqori sifatda o'zbek tilida bepul tomosha qiling.">
    <meta property="og:image" content="https://bestmedia-official.uz{% static 'images/favicon.png' %}">
    <meta property="og:image:secure_url" content="https://bestmedia-official.uz{% static 'images/favicon.png' %}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:site_name" content="BESTMEDIA">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BESTMEDIA - O'zbekistondagi Eng Yaxshi Media Sayti">
    <meta name="twitter:description"
          content="Eng sara va yangi anime seriallarni yuqori sifatda o'zbek tilida bepul tomosha qiling.">
    <meta name="twitter:image" content="https://bestmedia-official.uz{% static 'images/favicon.png' %}">

    <meta name="theme-color" content="#ff3366">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
