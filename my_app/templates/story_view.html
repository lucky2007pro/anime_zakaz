<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>{{ story.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial;
}

/* container */
.story-box {
    position: relative;
    width: 100%;
    height: 100vh;
}

/* MEDIA (smooth zoom feel) */
.story-media img,
.story-media video {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: black;
    transition: transform 0.4s ease;
}

/* TOP BAR — FIXED + CLEAN */
.top-bar {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    color: white;
    z-index: 10;
}

/* LEFT BUTTON */
.back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    padding: 8px 12px;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    flex-shrink: 0;
}

/* CENTER TITLE (fix overflow + ugly center issue) */
.title {
    flex: 1;
    text-align: center;
    font-size: 14px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    opacity: 0.95;

    color: #ffffff; /* 👈 rang */
    text-shadow: 0 2px 8px rgba(0,0,0,0.8); /* 👈 fon ustida aniq ko‘rinsin */
    font-weight: 600;
}

.bottom-bar {
    position: absolute;
    bottom: 15px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}

/* RIGHT VIEWS */
.views {
    flex-shrink: 0;
    font-size: 13px;
    opacity: 0.85;
    background: rgba(255,255,255,0.12);
    padding: 6px 10px;
    border-radius: 8px;
}

/* SWIPE ANIMATION LAYER */
.story-box.slide-left {
    animation: slideLeft 0.25s ease;
}

.story-box.slide-right {
    animation: slideRight 0.25s ease;
}

@keyframes slideLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
}

@keyframes slideRight {
    from { transform: translateX(0); }
    to   { transform: translateX(100%); }
}

.story-description {
    position: absolute;
    bottom: 120px; /* 👈 bottom-bar ustiga chiqadi */

    left: 15px;
    right: 15px;

    color: white;
    font-size: 13px;
    line-height: 1.4;

    background: rgba(0,0,0,0.35);
    padding: 10px 12px;
    border-radius: 10px;

    backdrop-filter: blur(6px);

    z-index: 60;
}

<body>

<div class="story-box" id="storyBox">

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>


    <!-- TOP -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='/'">⬅</button>

        <div class="title">
            {{ story.title }}
        </div>

        <div class="views">👁 {{ story.views.count }}</div>
    </div>

    <!-- MEDIA -->
    <div class="story-media">
        {% if story.video %}
            <video id="storyVideo" autoplay playsinline controls>
                <source src="{{ story.video.url }}">
            </video>
        {% elif story.image %}
            <img src="{{ story.image.url }}">
        {% endif %}
    </div>

    {% if story.description %}
    <div class="story-description">
        {{ story.description }}
    </div>
    {% endif %}

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">

        <!-- LINK BUTTON -->
        <div class="watch-btn">
            {% if story.link %}
            <button onclick="window.open('{{ story.link }}', '_blank')">
                ▶ Tomosha qilish
            </button>
            {% else %}
            <button disabled>
                ▶ Link yo‘q
            </button>
            {% endif %}
        </div>


    </div>

</div>

<script>
const nextUrl = "{% url 'next_story' story.id %}";
const prevUrl = "{% url 'prev_story' story.id %}";

const box = document.getElementById("storyBox");
const video = document.getElementById("storyVideo");
const progressBar = document.getElementById("progressBar");
const progress = document.getElementById("progressFill");

// =====================
// VIDEO PROGRESS
// =====================
if (video && progress) {

    video.addEventListener("timeupdate", () => {

        const percent =
            (video.currentTime / video.duration) * 100;

        progress.style.width = percent + "%";
    });

    video.addEventListener("ended", () => {

        progress.style.width = "100%";

        goNext();
    });
}

// =====================
// VIDEO SETTINGS
// =====================
if (video) {

    video.controls = true;

    video.addEventListener("ended", () => {
        goNext();
    });
}

// =====================
// SWIPE LOGIC (MOBILE)
// =====================
let startX = 0;
let startY = 0;

document.addEventListener("touchstart", e => {

    // progress bar ustida swipe ishlamasin
    if (e.target.closest(".progress-bar")) return;

    // video controller ustida ishlamasin
    if (e.target.closest("video")) return;

    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
});

document.addEventListener("touchend", e => {

    // progress bar ustida ishlamasin
    if (e.target.closest(".progress-bar")) return;

    // video controller ustida ishlamasin
    if (e.target.closest("video")) return;

    let endX = e.changedTouches[0].clientX;
    let endY = e.changedTouches[0].clientY;

    let diffX = startX - endX;
    let diffY = startY - endY;

    // faqat horizontal swipe
    if (Math.abs(diffX) > Math.abs(diffY)) {

        if (Math.abs(diffX) > 60) {

            // chapga swipe → next
            if (diffX > 0) {
                goNext();
            }

            // o‘ngga swipe → prev
            else {
                goPrev();
            }
        }
    }
});

// =====================
// PROGRESS BAR CONTROL
// =====================
function updateProgressPosition(clientX) {

    if (!video) return;

    const rect = progressBar.getBoundingClientRect();

    const x = clientX - rect.left;

    const percent = x / rect.width;

    video.currentTime = percent * video.duration;
}

// PC CLICK
progressBar.addEventListener("click", (e) => {
    updateProgressPosition(e.clientX);
});

// MOBILE TOUCH
progressBar.addEventListener("touchstart", (e) => {
    updateProgressPosition(e.touches[0].clientX);
});

// =====================
// ANIMATED NAVIGATION
// =====================
function goNext() {

    box.classList.add("slide-left");

    setTimeout(() => {
        window.location.href = nextUrl;
    }, 200);
}

function goPrev() {

    box.classList.add("slide-right");

    setTimeout(() => {
        window.location.href = prevUrl;
    }, 200);
}
</script>

</body>
</html>
