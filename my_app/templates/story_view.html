<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>{{ story.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ============================================================
   RESET & BASE
   ============================================================ */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* ============================================================
   BACKGROUND BLUR VIDEO (PC uchun)
   ============================================================ */
.bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    overflow: hidden;
}

.bg-video video {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: blur(25px);
    transform: scale(1.2);
}

/* ============================================================
   STORY CONTAINER
   ============================================================ */
.story-box {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* ============================================================
   PROGRESS BAR
   ============================================================ */
.progress-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: rgba(255,255,255,0.2);
    z-index: 100;
    cursor: pointer;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #00f3ff;
    transition: width 0.1s linear;
}

/* ============================================================
   TOP BAR
   ============================================================ */
.top-bar {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: white;
    z-index: 10;
}

.back-btn {
    background: rgba(255,255,255,0.15);
    border: none;
    padding: 8px 12px;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    flex-shrink: 0;
    font-size: 14px;
}

.title {
    flex: 1;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    opacity: 0.95;
}

.views {
    flex-shrink: 0;
    font-size: 13px;
    opacity: 0.85;
    background: rgba(255,255,255,0.12);
    padding: 6px 10px;
    border-radius: 8px;
    color: white;
}

/* ============================================================
   MEDIA
   ============================================================ */
.story-media img,
.story-media video {
    width: 100%;
    height: 100vh;
    object-fit: contain;
    background: black;
    display: block;
}

/* ============================================================
   DESCRIPTION
   ============================================================ */
.story-description {
    position: absolute;
    bottom: 80px;
    left: 15px; right: 15px;
    color: white;
    font-size: 13px;
    line-height: 1.4;
    background: rgba(0,0,0,0.35);
    padding: 10px 12px;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    z-index: 60;
}

/* ============================================================
   BOTTOM BAR
   ============================================================ */
.bottom-bar {
    position: absolute;
    bottom: 20px;
    left: 10px; right: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 50;
}

.watch-btn button {
    background: #00f3ff;
    color: #000;
    font-size: 14px;
    font-weight: bold;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s;
    box-shadow: 0 4px 20px rgba(0,243,255,0.3);
}

.watch-btn button:hover  { transform: scale(1.05); }

.watch-btn button:disabled {
    background: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
    cursor: default;
    transform: none;
    box-shadow: none;
}

/* ============================================================
   SWIPE OVERLAY — video ustida swipe ishlashi uchun
   ============================================================ */
.swipe-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 80px;
    z-index: 5;
    background: transparent;
    touch-action: pan-y;
}

/* ============================================================
   DESKTOP ARROW HINTS (sichqoncha hover qilganda ko'rinadi)
   ============================================================ */
.swipe-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    font-size: 28px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    border-radius: 50%;
    width: 48px; height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.swipe-hint.left  { left: 10px; }
.swipe-hint.right { right: 10px; }

.story-box:hover .swipe-hint { opacity: 1; }

/* ============================================================
   SWIPE ANIMATIONS
   ============================================================ */
.story-box.slide-left  { animation: slideLeft  0.25s ease forwards; }
.story-box.slide-right { animation: slideRight 0.25s ease forwards; }

@keyframes slideLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-100%); }
}

@keyframes slideRight {
    from { transform: translateX(0); }
    to   { transform: translateX(100%); }
}

/* ============================================================
   MOBILE  (max-width: 600px)
   ============================================================ */
@media (max-width: 600px) {

    .title {
        font-size: 15px;
        font-weight: 700;
        color: #00f3ff !important;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        opacity: 1;
    }

    .views        { font-size: 12px; border-radius: 10px; }
    .back-btn     { padding: 8px 12px; font-size: 14px; }

    .story-description {
        bottom: 110px;
        left: 10px; right: 10px;
        font-size: 12px;
        background: rgba(0,0,0,0.45);
        padding: 8px 10px;
    }

    .bottom-bar {
        position: fixed;
        bottom: 100px;
        left: 0; right: 0;
        padding: 12px 0;
    }

    .watch-btn button {
        font-size: 16px;
        font-weight: 800;
        padding: 12px 20px;
        border-radius: 14px;
    }

    .story-media { transform: translateY(-45px); }

    .navbar, .bottom-nav            { height: 70px; padding: 10px 0; }
    .navbar i, .navbar svg,
    .nav-icon, .bottom-nav i        { font-size: 26px !important; }
    .navbar button, .bottom-nav button { font-size: 16px; padding: 10px 12px; }
}

/* ============================================================
   DESKTOP / TABLET  (min-width: 768px)
   ============================================================ */
@media (min-width: 768px) {

    .story-box {
        width: 450px;
        height: 100vh;
        border-radius: 20px;
        background: rgba(0,0,0,0.3);
        box-shadow: 0 0 40px rgba(0,0,0,0.6);
    }

    .story-media video,
    .story-media img { height: 100vh; object-fit: contain; }

    .top-bar  { top: 15px; left: 15px; right: 15px; }
    .back-btn { padding: 8px 14px; font-size: 14px; border-radius: 12px; }
    .views    { font-size: 13px; padding: 7px 12px; }

    .bottom-bar { bottom: 50px; left: 15px; right: 15px; }
}

</style>
</head>
<body>

{% if story.video %}
<div class="bg-video">
    <video autoplay muted loop playsinline>
        <source src="{{ story.video.url }}">
    </video>
</div>
{% endif %}

<div class="story-box" id="storyBox">

    <!-- PROGRESS BAR -->
    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='/'">⬅</button>
        <div class="title">{{ story.title }}</div>
        <div class="views">👁 {{ story.views.count }}</div>
    </div>

    <!-- SWIPE OVERLAY (butun ekranda swipe ishlashi uchun) -->
    <div class="swipe-overlay" id="swipeOverlay"></div>

    <!-- DESKTOP ARROW HINTS -->
    <div class="swipe-hint left">&#8592;</div>
    <div class="swipe-hint right">&#8594;</div>

    <!-- MEDIA -->
    <div class="story-media">
        {% if story.video %}
            <video id="storyVideo" autoplay playsinline controls>
                <source src="{{ story.video.url }}">
            </video>
        {% elif story.image %}
            <img src="{{ story.image.url }}" alt="{{ story.title }}">
        {% endif %}
    </div>

    <!-- DESCRIPTION -->
    {% if story.description %}
    <div class="story-description">
        {{ story.description|linebreaks }}
    </div>
    {% endif %}

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <div class="watch-btn">
            {% if story.link %}
                <button onclick="window.open('{{ story.link|urlencode }}', '_blank')">
                    ▶ Tomosha qilish
                </button>
            {% else %}
                <button disabled>▶ Link yo'q</button>
            {% endif %}
        </div>
    </div>

</div>

<script>
    const nextUrl = "{% url 'next_story' story.id %}";
    const prevUrl = "{% url 'prev_story' story.id %}";

    const box          = document.getElementById("storyBox");
    const video        = document.getElementById("storyVideo");
    const progressBar  = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const swipeOverlay = document.getElementById("swipeOverlay");

    // ============================================================
    // VIDEO — PROGRESS & AUTO-NEXT
    // ============================================================
    if (video) {
        video.controls = true;

        video.addEventListener("timeupdate", () => {
            if (!isNaN(video.duration) && video.duration > 0) {
                progressFill.style.width =
                    (video.currentTime / video.duration * 100) + "%";
            }
        });

        video.addEventListener("ended", () => {
            progressFill.style.width = "100%";
            goNext();
        });
    }

    // ============================================================
    // PROGRESS BAR — SEEK
    // ============================================================
    function seekTo(clientX) {
        if (!video) return;
        const rect    = progressBar.getBoundingClientRect();
        const percent = (clientX - rect.left) / rect.width;
        video.currentTime = Math.max(0, Math.min(1, percent)) * video.duration;
    }

    progressBar.addEventListener("click", e => seekTo(e.clientX));
    progressBar.addEventListener("touchstart", e => {
        e.stopPropagation();
        seekTo(e.touches[0].clientX);
    }, { passive: true });

    // ============================================================
    // SWIPE NAVIGATION — butun ekranda ishlaydi
    // ============================================================
    let startX = 0, startY = 0;

    function onTouchStart(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }

    function onTouchEnd(e) {
        const diffX = startX - e.changedTouches[0].clientX;
        const diffY = startY - e.changedTouches[0].clientY;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 60) {
            diffX > 0 ? goNext() : goPrev();
        }
    }

    // Video ustidagi shaffof qatlam — swipe ishlaydi, controls ham ishlaydi
    swipeOverlay.addEventListener("touchstart", onTouchStart, { passive: true });
    swipeOverlay.addEventListener("touchend",   onTouchEnd,   { passive: true });

    // Boshqa elementlar (description, bottom-bar, va h.k.)
    document.addEventListener("touchstart", e => {
        if (e.target.closest(".progress-bar") ||
            e.target.closest("video") ||
            e.target.closest(".swipe-overlay")) return;
        onTouchStart(e);
    }, { passive: true });

    document.addEventListener("touchend", e => {
        if (e.target.closest(".progress-bar") ||
            e.target.closest("video") ||
            e.target.closest(".swipe-overlay")) return;
        onTouchEnd(e);
    }, { passive: true });

    // ============================================================
    // KEYBOARD NAVIGATION — ← → klavishlari
    // ============================================================
    document.addEventListener("keydown", e => {
        if (e.key === "ArrowRight") goNext();
        if (e.key === "ArrowLeft")  goPrev();
    });

    // ============================================================
    // ANIMATED NAVIGATION (bir marta ishlaydi)
    // ============================================================
    let navigating = false;

    function goNext() {
        if (navigating) return;
        navigating = true;
        box.classList.add("slide-left");
        setTimeout(() => { window.location.href = nextUrl; }, 220);
    }

    function goPrev() {
        if (navigating) return;
        navigating = true;
        box.classList.add("slide-right");
        setTimeout(() => { window.location.href = prevUrl; }, 220);
    }
</script>

</body>
</html>
