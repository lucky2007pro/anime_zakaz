{% extends 'custom_admin/base.html' %}

{% block page_title %}Daraja (BST) boshqaruvi{% endblock %}

{# base.html ning o'zi <style> ichida bu blokni chiqaradi, shuning uchun bu yerda <style> tegi yo'q #}
{% block extra_css %}
/* ===== darajabst_form ===== */
.dbf { padding: 30px; }
.dbf-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
.dbf-head h2 { font-size: 1.4rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

.dbf-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: #1e1e24; color: #fff; border: 1px solid #333;
    padding: 9px 16px; border-radius: 6px; font-weight: 700; font-size: 0.82rem;
    text-decoration: none; text-transform: uppercase; transition: 0.25s;
}
.dbf-link:hover { background: var(--accent); color: #000; border-color: var(--accent); }

.dbf-msg { padding: 11px 16px; border-radius: 8px; margin-bottom: 14px; font-size: 0.9rem; font-weight: 600; border: 1px solid; }
.dbf-msg.success { background: rgba(52,211,153,0.12); color: #34d399; border-color: rgba(52,211,153,0.35); }
.dbf-msg.error   { background: rgba(248,113,113,0.12); color: #f87171; border-color: rgba(248,113,113,0.35); }
.dbf-msg.warning { background: rgba(251,191,36,0.12); color: #fbbf24; border-color: rgba(251,191,36,0.35); }

.dbf-lookup { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.dbf-input {
    background: #0a0a0f; border: 1px solid var(--border-line); border-radius: 6px;
    padding: 10px 14px; color: #fff; font-size: 0.95rem; width: 190px; max-width: 100%;
    font-family: 'Outfit', sans-serif; outline: none;
}
.dbf-input:focus { border-color: var(--accent); }

.dbf-btn {
    background: var(--accent); color: #000; border: none; border-radius: 6px;
    padding: 10px 20px; font-weight: 800; font-size: 0.85rem; cursor: pointer;
    text-transform: uppercase; font-family: 'Outfit', sans-serif; transition: 0.25s;
}
.dbf-btn:hover { background: #fff; }
.dbf-btn.ghost { background: #1e1e24; color: #fff; border: 1px solid #333; }
.dbf-btn.ghost:hover { background: var(--accent); color: #000; border-color: var(--accent); }
.dbf-btn.danger { background: #fee2e2; color: #ef4444; border: 1px solid #fca5a5; }
.dbf-btn.danger:hover { background: #ef4444; color: #fff; }

/* foydalanuvchi + progress */
.dbf-user {
    background: #0a0a0f; border: 1px solid var(--border-line); border-radius: 12px;
    padding: 20px; margin-bottom: 22px;
}
.dbf-user-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.dbf-uname { font-size: 1.2rem; font-weight: 800; color: #fff; }
.dbf-uid { font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }
.dbf-level { font-size: 2rem; font-weight: 900; line-height: 1; }
.dbf-level small { font-size: 0.95rem; color: var(--text-dim); font-weight: 700; }
.dbf-stage {
    display: inline-block; margin-top: 6px; padding: 3px 12px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 800; border: 1px solid;
}

.dbf-bar { position: relative; height: 14px; border-radius: 8px; background: rgba(255,255,255,0.07); overflow: hidden; }
.dbf-fill { height: 100%; border-radius: 8px; }
.dbf-bar-meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 0.72rem; font-weight: 700; color: var(--text-dim); }

.dbf-flags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.dbf-badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
.dbf-badge.green  { background: rgba(52,211,153,0.15); color: #34d399; }
.dbf-badge.yellow { background: rgba(251,191,36,0.15); color: #fbbf24; }
.dbf-badge.blue   { background: rgba(0,243,255,0.12); color: var(--accent); }
.dbf-badge.gray   { background: rgba(255,255,255,0.06); color: var(--text-dim); }

/* amallar */
.dbf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 26px; }
.dbf-card { background: #0a0a0f; border: 1px solid var(--border-line); border-radius: 12px; padding: 18px; }
.dbf-card h3 { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.dbf-card p { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 12px; line-height: 1.45; }
.dbf-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dbf-row .dbf-input { width: 120px; }

/* tarix */
.dbf-section-title { font-size: 0.85rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 800; }
.dbf-table-wrap { width: 100%; overflow-x: auto; }
.dbf-table { width: 100%; border-collapse: collapse; min-width: 480px; }
.dbf-table th { text-align: left; padding: 12px; font-size: 0.72rem; color: var(--accent); text-transform: uppercase; border-bottom: 1px solid var(--border-line); letter-spacing: 1px; }
.dbf-table td { padding: 12px; font-size: 0.9rem; border-bottom: 1px solid #111; color: #fff; }
.dbf-table tr:hover td { background: #111; }
.dbf-empty { text-align: center; padding: 30px; color: var(--text-dim); }

@media (max-width: 768px) {
    .dbf { padding: 16px; }
    .dbf-head h2 { font-size: 1.15rem; }
    .dbf-level { font-size: 1.6rem; }
}
{% endblock %}

{% block content %}
<div class="glass-panel dbf">

    <div class="dbf-head">
        <h2>Daraja (BST) boshqaruvi</h2>
        <a href="{% url 'admin_daraja_list' %}" class="dbf-link"><i class='bx bx-arrow-back'></i> Ro'yxatga</a>
    </div>

    {% if messages %}
        {% for m in messages %}
            <div class="dbf-msg {{ m.tags }}">{{ m }}</div>
        {% endfor %}
    {% endif %}

    <!-- ID orqali qidirish -->
    <form method="get" action="{% url 'admin_daraja_form_lookup' %}" class="dbf-lookup">
        <input type="text" name="user_id" class="dbf-input" placeholder="Foydalanuvchi ID" value="{% if target_user %}{{ target_user.id }}{% endif %}">
        <button type="submit" class="dbf-btn ghost">ID orqali ochish</button>
    </form>

    {% if target_user %}

        <!-- FOYDALANUVCHI + PROGRESS -->
        <div class="dbf-user">
            <div class="dbf-user-top">
                <div>
                    <div class="dbf-uname">{{ target_user.username }}</div>
                    <div class="dbf-uid">ID: #{{ target_user.id }}</div>
                </div>
                <div style="text-align:right;">
                    <div class="dbf-level" style="color: {{ stage_color }};">{{ data.level }} <small>/ {{ bst_max }} BST</small></div>
                    <span class="dbf-stage" style="color: {{ stage_color }}; border-color: {{ stage_color }};">{{ stage_name }}</span>
                </div>
            </div>

            <div class="dbf-bar">
                <div class="dbf-fill" style="width: {{ percent_css }}%; background: {{ stage_color }};"></div>
            </div>
            <div class="dbf-bar-meta">
                <span>0</span>
                <span>🎁 {{ goal }}</span>
                <span>{{ bst_max }}</span>
            </div>

            <div class="dbf-flags">
                {% if data.reward_claimed %}
                    <span class="dbf-badge green">Yutuq olingan</span>
                {% elif data.level >= goal %}
                    <span class="dbf-badge yellow">Yutuqni olishi mumkin</span>
                {% else %}
                    <span class="dbf-badge gray">Yutuqqa {{ goal_left }} BST qoldi</span>
                {% endif %}

                {% if data.puzzle_last_done %}
                    <span class="dbf-badge blue">Puzzle: {{ data.puzzle_last_done|date:"d.m.Y H:i" }}</span>
                {% else %}
                    <span class="dbf-badge gray">Puzzle yechilmagan</span>
                {% endif %}

                {% if puzzle_in_progress %}
                    <span class="dbf-badge yellow">Puzzle jarayonda</span>
                {% endif %}
            </div>
        </div>

        <!-- AMALLAR -->
        <div class="dbf-grid">

            <div class="dbf-card">
                <h3>Darajani belgilash</h3>
                <p>BST ni aniq qiymatga o'rnatadi (0 – {{ bst_max }}).</p>
                <form method="post" action="{% url 'admin_daraja_form' target_user.id %}" class="dbf-row">
                    {% csrf_token %}
                    <input type="hidden" name="user_id" value="{{ target_user.id }}">
                    <input type="hidden" name="action" value="set">
                    <input type="number" name="level" class="dbf-input" min="0" max="{{ bst_max }}" value="{{ data.level }}" required>
                    <button type="submit" class="dbf-btn">Saqlash</button>
                </form>
            </div>

            <div class="dbf-card">
                <h3>BST qo'shish / ayirish</h3>
                <p>Mavjud darajaga qo'shadi yoki undan ayiradi (0 dan past, {{ bst_max }} dan baland bo'lmaydi).</p>
                <form method="post" action="{% url 'admin_daraja_form' target_user.id %}" class="dbf-row">
                    {% csrf_token %}
                    <input type="hidden" name="user_id" value="{{ target_user.id }}">
                    <input type="number" name="amount" class="dbf-input" min="1" max="{{ bst_max }}" placeholder="Miqdor" required>
                    <button type="submit" name="action" value="add" class="dbf-btn">+ Qo'shish</button>
                    <button type="submit" name="action" value="sub" class="dbf-btn ghost">− Ayirish</button>
                </form>
            </div>

            <div class="dbf-card">
                <h3>{{ goal }} BST yutug'i</h3>
                <p>Yutuq holati: <b style="color:#fff;">{% if data.reward_claimed %}olingan{% else %}olinmagan{% endif %}</b>. O'zgartirsangiz, foydalanuvchi yutuqni qayta olishi (yoki olmasligi) mumkin.</p>
                <form method="post" action="{% url 'admin_daraja_form' target_user.id %}" class="dbf-row">
                    {% csrf_token %}
                    <input type="hidden" name="user_id" value="{{ target_user.id }}">
                    <input type="hidden" name="action" value="toggle_reward">
                    <button type="submit" class="dbf-btn ghost">{% if data.reward_claimed %}Olinmagan qilish{% else %}Olingan qilish{% endif %}</button>
                </form>
            </div>

            <div class="dbf-card">
                <h3>Puzzle limiti</h3>
                <p>24 soatlik limitni bekor qiladi, foydalanuvchi puzzle'ni darhol qayta yecha oladi.</p>
                <form method="post" action="{% url 'admin_daraja_form' target_user.id %}" class="dbf-row">
                    {% csrf_token %}
                    <input type="hidden" name="user_id" value="{{ target_user.id }}">
                    <input type="hidden" name="action" value="puzzle_reset">
                    <button type="submit" class="dbf-btn ghost">Limitni bekor qilish</button>
                </form>
            </div>

            <div class="dbf-card" style="border-color: rgba(239,68,68,0.35);">
                <h3 style="color:#f87171;">To'liq nolga tushirish</h3>
                <p>Darajani 0 qiladi, yutuq va puzzle limitini bekor qiladi hamda BST tarixini o'chiradi. Foydalanuvchi hamma narsani qaytadan yig'adi.</p>
                <form method="post" action="{% url 'admin_daraja_form' target_user.id %}" class="dbf-row">
                    {% csrf_token %}
                    <input type="hidden" name="user_id" value="{{ target_user.id }}">
                    <input type="hidden" name="action" value="reset">
                    <button type="submit" class="dbf-btn danger" onclick="return confirm('{{ target_user.username }} darajasi to\'liq 0 ga tushirilsinmi?');">0 ga tushirish</button>
                </form>
            </div>

        </div>

        <!-- BST TARIXI -->
        <div class="dbf-section-title">So'nggi BST tarixi ({{ logs|length }})</div>
        <div class="dbf-table-wrap">
            <table class="dbf-table">
                <thead>
                    <tr><th>Manba</th><th>Ref</th><th>BST</th><th>Sana</th></tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td style="font-weight:700;">{{ log.get_source_display }}</td>
                        <td style="color:var(--text-dim);">{{ log.ref|truncatechars:30 }}</td>
                        <td style="color:var(--accent); font-weight:800;">+{{ log.amount }}</td>
                        <td style="color:var(--text-dim); white-space:nowrap;">{{ log.created_at|date:"d.m.Y H:i" }}</td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="4" class="dbf-empty">Hali BST tarixi yo'q</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    {% else %}
        <div class="dbf-empty">
            <i class='bx bx-search-alt' style="font-size:2rem; display:block; margin-bottom:8px;"></i>
            Boshqarish uchun foydalanuvchi ID sini kiriting.
        </div>
    {% endif %}

</div>
{% endblock %}
